[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-secretary"
version = "0.0.1"
description = "Workflow agent that designs and runs a workflow toward a goal, one step at a time, with a pluggable workflow tool provider (Snakemake first)."
requires-python = ">=3.10"
dependencies = ["behalf>=0.1.1", "pyyaml"]

[project.optional-dependencies]
aws = ["behalf[aws]>=0.1.1"]
claude = ["behalf[claude]>=0.1.1"]
gemini = ["behalf[gemini]>=0.1.1"]
all = ["behalf[all]>=0.1.1"]
workflow = ["snakemake>=8", "snakemake-wrapper-utils", "pandas"]
dev = ["pytest>=8"]

[project.scripts]
workflow-secretary = "workflowsecretary.cli:main"

[tool.setuptools.packages.find]
include = ["workflowsecretary*"]
